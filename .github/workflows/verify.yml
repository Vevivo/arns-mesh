name: Verify Mesh and build release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - run: npm run check:public
      - run: npm test
      - run: node scripts/doctor.mjs examples/network-profile.example.json
      - if: runner.os == 'Linux'
        run: bash scripts/test-install.sh
  windows-package:
    needs: test
    # Build reviewable candidate ZIPs for this repository's own PRs too.
    # Fork PRs remain source-test only; draft releases remain main-only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Get and verify pinned Electron runtime
        run: python scripts/download-electron.py --out "$env:RUNNER_TEMP/electron-runtime"
      - name: Build clean portable package
        run: python scripts/package-windows.py --runtime "$env:RUNNER_TEMP/electron-runtime" --out dist
      - name: Executable version check (not GUI acceptance)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE='1'
          & ./dist/Mesh-Browser/Mesh-Browser.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Extract the candidate ZIP and install isolated UI driver
        shell: pwsh
        run: |
          "QA_TOOLS=$env:RUNNER_TEMP/mesh-search-tools" >> $env:GITHUB_ENV
          "QA_OUTPUT=$env:RUNNER_TEMP/mesh-search-ui" >> $env:GITHUB_ENV
          $zip = Get-ChildItem dist/ArNS-Mesh-Browser-Windows-x64-*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP/candidate-zip"
          "QA_EXE=$env:RUNNER_TEMP/candidate-zip/Mesh-Browser/Mesh-Browser.exe" >> $env:GITHUB_ENV
          npm install --prefix "$env:RUNNER_TEMP/mesh-search-tools" playwright@1.62.1 --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise search and connection monitor in real Windows Electron
        run: node qa/desktop/search.cjs
      - name: Prepare real public content for upstream outage acceptance
        env:
          MESH_QA_PROFILE: ${{ secrets.MESH_QA_PROFILE }}
          # Public publisher identity already accepted by the operator's reader.
          # It is a QA trust anchor, not a private key or application default.
          QA_ACCEPTED_PUBLISHERS: '1330e51e4fc65597312fb9252cf457bf6e0efedf1075bd5d3e977f6dff239d7a'
          QA_OUTPUT: ${{ runner.temp }}/mesh-upstream-outage
        run: node qa/desktop/outage-peer.mjs seed
      - name: Open real ArNS sites with DNS, RPC and Arweave blocked for reader and supporter
        env:
          QA_OUTPUT: ${{ runner.temp }}/mesh-upstream-outage
          QA_FIREWALL_GROUP: ArNS-Mesh-Disaster-${{ github.run_id }}
        run: node qa/desktop/upstream-outage.cjs
      - name: Restore the disposable runner network
        if: always()
        shell: pwsh
        run: ./qa/disaster/firewall.ps1 -Mode clear -Group ArNS-Mesh-Disaster-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-upstream-outage
          path: |
            ${{ runner.temp }}/mesh-upstream-outage/results.json
            ${{ runner.temp }}/mesh-upstream-outage/seed-summary.json
            ${{ runner.temp }}/mesh-upstream-outage/serving-summary.json
            ${{ runner.temp }}/mesh-upstream-outage/*.png
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-search-ui
          path: |
            ${{ runner.temp }}/mesh-search-ui/*.png
            ${{ runner.temp }}/mesh-search-ui/results.json
            ${{ runner.temp }}/mesh-search-ui/electron.log
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/build.json
          retention-days: 14
      - name: Publish verified release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($releases | Where-Object { $_.tag_name -eq $tag }) {
            Write-Output 'Existing release preserved. New build is in workflow artifacts.'
            exit 0
          }
          if ($version -match '-') { throw 'Final release workflow requires a stable version.' }
          gh release create $tag "dist/ArNS-Mesh-Browser-Windows-x64-$version.zip" dist/SHA256SUMS.txt dist/build.json --target "$env:GITHUB_SHA" --title "ArNS Mesh $version" --latest --notes-file docs/en/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retire superseded 0.5.0 download
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '0.5.1') { exit 0 }
          $current = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v0.5.1" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = $current.assets | Where-Object { $_.name -eq 'ArNS-Mesh-Browser-Windows-x64-0.5.1.zip' -and $_.state -eq 'uploaded' -and $_.size -gt 100000000 }
          if ($current.draft -or $current.prerelease -or -not $zip) { throw 'The replacement stable Windows download is not ready.' }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $old = $releases | Where-Object { $_.tag_name -eq 'v0.5.0' }
          foreach ($release in $old) {
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
