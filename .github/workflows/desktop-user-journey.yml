name: Desktop user journey on Windows
on:
  push:
    branches: [qa/desktop-user-journey]
permissions:
  contents: read
  actions: read
jobs:
  original-package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download the original draft portable package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35994955843 --repo "$env:GITHUB_REPOSITORY" --name windows-preview --dir "$env:RUNNER_TEMP/mesh-original"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem "$env:RUNNER_TEMP/mesh-original/*.zip" | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '2113a72a8aaf6735806fae90624f82714d242d0bbffadde2764f978730761e07') { throw 'Original package checksum mismatch' }
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP/mesh-original/extracted"
          "QA_EXE=$env:RUNNER_TEMP/mesh-original/extracted/Mesh-Browser/Mesh-Browser.exe" >> $env:GITHUB_ENV
          "QA_OUTPUT=$env:RUNNER_TEMP/mesh-user-evidence" >> $env:GITHUB_ENV
          "QA_TOOLS=$env:RUNNER_TEMP/mesh-qa-tools" >> $env:GITHUB_ENV
      - name: Install isolated UI driving tools
        shell: pwsh
        run: |
          npm install --prefix "$env:QA_TOOLS" playwright@1.62.1 --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pywinauto==0.6.9 Pillow==11.3.0 imageio-ffmpeg==0.6.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Drive the unmodified app as a new user
        run: node qa/desktop/user-journey.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-windows-user-experience
          path: |
            ${{ runner.temp }}/mesh-user-evidence/*.png
            ${{ runner.temp }}/mesh-user-evidence/*.mp4
            ${{ runner.temp }}/mesh-user-evidence/results.json
            ${{ runner.temp }}/mesh-user-evidence/electron.log
          retention-days: 14
