name: Test published desktop with live ArNS names
on:
  push:
    branches: [qa/live-release]
permissions:
  contents: read
jobs:
  released-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download the published ZIP and verify its hash
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/mesh-release.zip"
          Invoke-WebRequest 'https://github.com/Vevivo/arns-mesh/releases/download/v0.5.0-preview.5/ArNS-Mesh-Browser-Windows-x64-0.5.0-preview.5.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne '68adc236bb8e6a3a6ffc3152646f67a30d00b29caba343785e0a45435e6afa03') { throw 'Published package hash mismatch' }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/mesh-release"
          "QA_EXE=$env:RUNNER_TEMP/mesh-release/Mesh-Browser/Mesh-Browser.exe" >> $env:GITHUB_ENV
          "QA_OUTPUT=$env:RUNNER_TEMP/mesh-live-evidence" >> $env:GITHUB_ENV
          "QA_TOOLS=$env:RUNNER_TEMP/mesh-live-tools" >> $env:GITHUB_ENV
      - name: Install isolated desktop UI drivers
        shell: pwsh
        run: |
          npm install --prefix "$env:QA_TOOLS" playwright@1.62.1 --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pywinauto==0.6.9 Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Open the real desktop and enter live names
        env:
          MESH_QA_PROFILE: ${{ secrets.MESH_QA_PROFILE }}
        run: node qa/desktop/live-release.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: published-desktop-live-evidence
          path: |
            ${{ runner.temp }}/mesh-live-evidence/results.json
            ${{ runner.temp }}/mesh-live-evidence/*.png
            ${{ runner.temp }}/mesh-live-evidence/electron-sanitized.log
          retention-days: 14
