name: Connection and supporter setup help
description: Get help connecting a reader or joining the current supporter network.
title: "Mesh connection request"
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not post private IPs, browsing history, keys or diagnostic files.
        Ask an operator for a reusable mesh1 connection code (preview.8+) or a legacy JSON profile.
        The standard public ZIP contains no provider invitation. This request does not guarantee service.
        Codes carry network identity and starting addresses; no payment or activation license is required.
        Automatic supporter announcements and peer exchange are planned, not available yet.
        To support the existing network, follow docs/en/supporter.md; you do not need to create your own network.
        Sharing an address here is not automatic admission or proof of redundancy.
  - type: input
    id: version
    attributes:
      label: Desktop version
      placeholder: 0.5.0-preview.12 (candidate) or 0.5.0-preview.8 (published)
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: I want to
      options:
        - Use the desktop reader
        - Operate a supporter peer
    validations:
      required: true
